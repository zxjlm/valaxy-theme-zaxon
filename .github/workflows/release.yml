name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Required for npm trusted publishing via GitHub OIDC.
  # Configure on https://www.npmjs.com/package/valaxy-theme-zaxon → Settings → Trusted Publisher:
  #   Organization or user: zxjlm
  #   Repository: valaxy-theme-zaxon
  #   Workflow filename: release.yml
  #   Allowed actions: enable npm publish (required for direct publish)
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Node 24 ships a recent enough npm for trusted publishing (needs npm >= 11.5.1).
      # Do not set registry-url: setup-node would write an empty _authToken line that
      # prevents the OIDC publish flow from running.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install map rendering libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libglfw3 libegl1 libopengl0 libuv1t64

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore map resource cache
        uses: actions/cache@v4
        with:
          path: demo/.cache/zaxon
          key: travel-maps-v1-${{ hashFiles('demo/pages/**/*.md', 'demo/public/travel-maps/**/map.json', 'demo/valaxy.config.ts', 'theme/node/travel*.ts', 'theme/node/generate-travel-maps.ts', 'theme/composables/travel*.ts', 'pnpm-lock.yaml') }}
          restore-keys: travel-maps-v1-

      - name: Build
        run: xvfb-run -a pnpm run build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'

      # Auth via npm trusted publishing (OIDC). Do not pass NODE_AUTH_TOKEN here:
      # a stale/expired NPM_TOKEN secret would short-circuit OIDC and fail with E404.
      - name: Publish to npm
        run: pnpm ci:publish

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
