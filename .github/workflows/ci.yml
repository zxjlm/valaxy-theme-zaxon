name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  travel-maps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: pnpm

      - name: Install map rendering libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libglfw3 libegl1 libopengl0 libuv1t64

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore map resource cache
        uses: actions/cache@v4
        with:
          path: demo/.cache/zaxon
          key: travel-maps-v1-${{ hashFiles('demo/pages/**/*.md', 'demo/public/travel-maps/**/map.json', 'demo/valaxy.config.ts', 'theme/node/travel*.ts', 'theme/node/generate-travel-maps.ts', 'theme/composables/travel*.ts', 'pnpm-lock.yaml') }}
          restore-keys: travel-maps-v1-

      - name: Restore or generate and verify maps
        run: xvfb-run -a pnpm travel:maps
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'

      - name: Share maps with build jobs
        uses: actions/upload-artifact@v4
        with:
          name: travel-maps
          path: demo/public/travel-maps
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Lint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

  # check windows build
  build:
    needs: travel-maps
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [24]
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Restore prepared maps
        uses: actions/download-artifact@v4
        with:
          name: travel-maps
          path: demo/public/travel-maps

      - name: Build
        run: pnpm run build

      - name: Build:demo
        run: pnpm run build:demo
